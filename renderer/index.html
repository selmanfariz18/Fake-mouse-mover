<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Mouse Mover</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f13;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        h1 {
            font-size: 1.6rem;
            letter-spacing: 2px;
            color: #a78bfa;
        }

        .status-badge {
            padding: 6px 18px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            background: #1e1e2e;
            border: 1px solid #333;
            transition: all 0.3s;
        }

        .status-badge.running {
            background: #14532d;
            border-color: #22c55e;
            color: #22c55e;
        }

        .status-badge.stopped {
            background: #1e1e2e;
            border-color: #555;
            color: #aaa;
        }

        .btn-row {
            display: flex;
            gap: 16px;
        }

        button {
            padding: 12px 32px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #startBtn {
            background: #7c3aed;
            color: #fff;
        }

        #startBtn:hover:not(:disabled) {
            background: #6d28d9;
        }

        #stopBtn {
            background: #dc2626;
            color: #fff;
        }

        #stopBtn:hover:not(:disabled) {
            background: #b91c1c;
        }

        .info-box {
            background: #1e1e2e;
            border: 1px solid #2a2a3e;
            border-radius: 12px;
            padding: 16px 28px;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            line-height: 1.8;
        }

        .coords {
            font-size: 0.95rem;
            color: #a78bfa;
            font-weight: 600;
            min-height: 24px;
        }
    </style>
</head>

<body>
    <h1>🖱️ Mouse Mover</h1>

    <div class="status-badge stopped" id="statusBadge">● STOPPED</div>

    <div class="btn-row">
        <button id="startBtn">▶ Start</button>
        <button id="stopBtn" disabled>■ Stop</button>
    </div>

    <div class="coords" id="coords">—</div>

    <div class="info-box">
        Moves mouse randomly every <strong>10 seconds</strong><br />
        Press <kbd>ESC</kbd> to stop anytime
    </div>

    <script src="app.js"></script>
</body>

</html>
